apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-filter
spec:
  image: localhost:5001/flink-job:latest
  imagePullPolicy: Always
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "2048m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "2048m"
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/flink-filter.jar
    entryClass: org.example.KafkaHighValuePurchaseFilterJob
    parallelism: 2
    upgradeMode: stateless
