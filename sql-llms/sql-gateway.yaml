apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-sql-gateway-config
data:
  config.yaml: |
    execution.target: kubernetes-session
    kubernetes.namespace: flink
    kubernetes.cluster-id: flink-sql-session
    rest.address: flink-sql-session-rest
    rest.port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-sql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-sql-gateway
  template:
    metadata:
      labels:
        app: flink-sql-gateway
    spec:
      serviceAccountName: default
      containers:
        - name: sql-gateway
          image: localhost:5001/flink-ai-demo:2.1.2
          command: ["/bin/bash", "-c"]
          args:
            - |
              bin/sql-gateway.sh start-foreground \
              -Dsql-gateway.endpoint.rest.address=flink-sql-gateway \
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/config.yaml
              subPath: config.yaml
      volumes:
        - name: flink-config
          configMap:
            name: flink-sql-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: flink-sql-gateway
spec:
  selector:
    app: flink-sql-gateway
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: flink
  name: flink-service-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-sql-gateway-bind
  namespace: flink
subjects:
  - kind: ServiceAccount
    name: default  # or your custom SA
    namespace: flink
roleRef:
  kind: Role
  name: flink-service-reader
  apiGroup: rbac.authorization.k8s.io
